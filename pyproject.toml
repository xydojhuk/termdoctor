[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termdoctor"
dynamic = ["version"]
description = "A multilingual CLI assistant that explains Python terminal errors and suggests practical fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "xydojhuk" }
]
keywords = [
    "cli",
    "terminal",
    "python",
    "debugging",
    "traceback",
    "developer-tools"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities"
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
    "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0"
]

[project.scripts]
termdoctor = "termdoctor.cli:main"
td = "termdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/xydojhuk/termdoctor"
Repository = "https://github.com/xydojhuk/termdoctor"
Issues = "https://github.com/xydojhuk/termdoctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "termdoctor.__version__" }

[tool.setuptools.package-data]
termdoctor = ["engines/python/*.yml", "locales/*.yml", "education/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]