  add_dependencies: Додайте requirements.txt або pyproject.toml, щоб середовище проєкту можна було відтворити.
  install_requirements: Установіть залежності з виявлених файлів requirements.
  install_pyproject: 'Якщо проєкт можна встановити як пакет, виконайте: {python} -m pip install -e .'
  warning_env_example: Файл .env існує, але .env.example відсутній.
  add_env_example: Додайте .env.example із безпечними прикладами значень.
  warning_tests: Теку tests не знайдено.
  add_tests: Додайте tests/, якщо проєкт підтримуватиметься або публікуватиметься.
  django_manage_missing: Знайдено залежність Django, але файл manage.py відсутній.
  django: Для помилок Django перевірте settings.py, INSTALLED_APPS, підключення до БД, шаблони та назви URL.
  fastapi: Для помилок FastAPI перевірте моделі запитів і відповідей, валідацію Pydantic і шлях імпорту Uvicorn.
  flask: Для помилок Flask перевірте фабрику застосунку, шлях імпорту, маршрути, шаблони та змінні середовища.
  pydantic: Для помилок Pydantic перевірте типи полів моделі, валідатори, alias і конфігурацію.
  sqlalchemy: Для помилок SQLAlchemy перевірте URL бази даних, сесії, моделі, зв’язки та виконані міграції.
  alembic: Для помилок Alembic перевірте alembic.ini, env.py, ідентифікатори ревізій і стан міграцій.
  pytest: Для помилок pytest перевірте пошук тестів, назви фікстур, conftest.py та результати assert.
  aiogram: Для помилок aiogram перевірте токен бота, підключення маршрутизаторів, async-обробники та відповідь Telegram
    API.
  telebot: Для помилок pyTelegramBotAPI перевірте токен, фільтри обробників, polling/webhook та відповідь Telegram
    API.
