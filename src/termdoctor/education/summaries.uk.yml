syntax_error: Python не може зрозуміти, як записано цю частину програми.
indentation_error: Рядки коду розташовано з відступами, які Python не може розібрати.
module_not_found: Python шукає модуль `{module}`, але не знаходить його в поточному середовищі.
import_error_circular: Два Python-файли залежать один від одного ще до завершення завантаження.
import_error: Python знайшов файл, але не зміг отримати з нього потрібне ім’я.
name_error: Python зустрів `{name}`, але не знає, що означає це ім’я.
type_error_missing_argument: Під час виклику функції їй не передали обов’язкове значення.
type_error_unexpected_keyword: Функції передали назву аргументу, якої вона не розуміє.
type_error_not_callable: Програма спробувала викликати звичайне значення як функцію.
type_error_not_subscriptable: Програма спробувала звернутися до значення через квадратні дужки, але так робити не
  можна.
type_error_not_iterable: Програма спробувала перебрати значення, яке не можна перебирати.
type_error_unsupported_operand: Ці значення не можна поєднати вибраною операцією.
type_error_multiple_values: Функція отримала один і той самий аргумент кілька разів.
type_error: Python не може виконати цю операцію з переданим значенням.
value_error_invalid_literal: Python не може прочитати цей рядок як число.
value_error: Значення має відповідний тип, але не підходить для цієї операції.
attribute_error_none: Програма очікувала об’єкт, але отримала `None`.
attribute_error: Об’єкт не має властивості або методу з такою назвою.
key_error: Програма запитала у словнику ключ, якого там немає.
index_error: Програма намагається отримати елемент за межами списку.
file_not_found: Python намагається відкрити файл або теку, яких не знаходить.
permission_error: Операційна система заборонила доступ до ресурсу.
zero_division_error: Програма спробувала поділити число на нуль.
recursion_error: Функція надто багато разів викликала саму себе, не зупинившись.
unicode_decode_error: Python не може прочитати байти як текст у вибраному кодуванні.
json_decode_error: Текст порушує правила запису JSON.
unbound_local_error: Локальну змінну намагаються прочитати до присвоєння.
assertion_error: Перевірка умови в програмі показала, що вона хибна.
