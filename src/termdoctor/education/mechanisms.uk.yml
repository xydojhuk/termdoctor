syntax_error: Синтаксичний аналіз відбувається до виконання коду модуля. Якщо токени не відповідають граматиці Python,
  інтерпретатор не може побудувати синтаксичне дерево.
indentation_error: Відступи є частиною граматики Python. Токени INDENT і DEDENT мають відповідати структурі блоків
  після складених інструкцій.
module_not_found: Система імпорту шукає модуль через sys.meta_path та шляхи sys.path. Пакети іншого інтерпретатора
  чи віртуального середовища можуть бути недоступні поточному процесу.
import_error_circular: Python додає модуль до sys.modules до виконання всіх його інструкцій. Повторний імпорт може
  побачити частково ініціалізований модуль без потрібного імені.
import_error: Пошук модуля та пошук конкретного імені всередині нього — різні дії. Модуль може завантажитися, хоча
  потрібне ім’я відсутнє або ще не створене.
name_error: 'Python шукає ім’я в доступних просторах імен: локальному, зовнішніх областях функцій, глобальному та
  вбудованому. Якщо знайти прив’язку імені до значення не вдається, виникає NameError. Ще не виконане присвоєння
  не створює ім’я.'
type_error_missing_argument: Перед виконанням функції Python пов’язує позиційні й іменовані аргументи з її параметрами.
  Якщо обов’язковий параметр залишився без значення, помилка виникає ще до запуску тіла функції.
type_error_unexpected_keyword: Іменовані аргументи звіряються із сигнатурою функції. Якщо функція не приймає додаткові
  ключі через **kwargs, невідоме ім’я неможливо пов’язати з параметром.
type_error_not_callable: Виклик x() використовує протокол виклику об’єкта. Значення має підтримувати виклик; сама
  наявність даних у змінній не робить значення функцією.
type_error_not_subscriptable: Вираз x[key] звертається до протоколу індексації, зазвичай __getitem__. Типи без цієї
  операції не можна індексувати.
type_error_not_iterable: Цикл for отримує ітератор через iter(). Об’єкт має підтримувати протокол ітерації; просто
  мати значення недостатньо.
type_error_unsupported_operand: Python вибирає реалізацію оператора за типами операндів. Якщо сумісного методу не
  знайдено, операція викликає TypeError.
type_error_multiple_values: Зв’язування аргументів призначає кожному параметру одне значення. Позиційний та іменований
  аргументи можуть випадково потрапити до одного параметра.
type_error: TypeError повідомляє про несумісність операції та типів об’єктів. Дані можуть бути коректними окремо,
  але операція не визначена для їх поєднання.
value_error_invalid_literal: Функція перетворення отримує рядок, а потім розбирає запис числа. Недопустимий символ
  або формат спричиняє помилку розбору.
value_error: ValueError означає, що тип аргументу допустимий, але конкретний вміст порушує обмеження функції.
attribute_error_none: None — спеціальне значення відсутності результату. Воно не має прикладних методів і полів
  очікуваного об’єкта.
attribute_error: Доступ до атрибутів відбувається за правилами пошуку екземпляра та класу, зокрема дескрипторів.
  Відсутнє ім’я призводить до AttributeError.
key_error: Звернення до словника шукає ключ за правилами порівняння та хешування. Не доданий ключ або ключ іншого
  типу через звичайну індексацію не знаходиться.
index_error: Індекси послідовностей починаються з нуля та мають бути в допустимих межах. Від’ємні індекси рахують
  із кінця, але теж мають указувати на наявний елемент.
file_not_found: Відносний шлях обчислюється від робочої теки процесу, а не обов’язково від теки Python-файлу.
permission_error: Операційна система перевіряє власника та права процесу під час доступу до ресурсу. Якщо системний
  виклик відхилено, Python видає PermissionError.
zero_division_error: Дільник обчислюється до самого ділення. Якщо він дорівнює нулю, операція недопустима і Python
  викликає ZeroDivisionError.
recursion_error: Кожен рекурсивний виклик додає кадр стека. Якщо рекурсія не завершується, глибина перевищить установлений
  ліміт Python.
unicode_decode_error: Декодування зіставляє байти символам Unicode відповідно до кодування. Недопустиму послідовність
  байтів не можна прочитати без спеціального режиму обробки помилок.
json_decode_error: Парсер JSON очікує сувору граматику з подвійними лапками для рядків і правильними роздільниками.
  Запис Python не є тотожним JSON.
unbound_local_error: Присвоєння імені всередині функції зазвичай робить його локальним у всьому тілі функції. Читання
  до виконання присвоєння спричиняє UnboundLocalError.
assertion_error: Оператор assert перевіряє вираз і викликає AssertionError за хибного результату. Він призначений
  для внутрішніх інваріантів, а не для перевірки недовіреного вводу.
runtime_error: RuntimeError виникає, коли операція не може продовжуватися в поточному стані й точнішого класу помилки
  немає. Причину допомагають визначити повідомлення та стек викликів.
os_error: OSError відображає збій системної операції. Поля errno, filename та strerror допомагають відрізнити відсутність
  ресурсу від проблем із правами чи параметрами системного виклику.
is_a_directory_error: Об’єкт за вказаним шляхом може існувати, але мати невідповідний тип. Операція читання звичайного
  файлу не може використовувати каталог як файл.
not_a_directory_error: Шлях обробляється по частинах. Кожен проміжний компонент має бути каталогом, інакше перехід
  до наступної частини неможливий.
eof_error: input() та інші функції читання викликають EOFError, якщо запитують дані після кінця потоку. Таке буває
  з перенаправленим або закритим stdin.
connection_error: Помилка підключення виникає ще до отримання коректної відповіді застосунку. Причина може бути
  в DNS, TCP, TLS, проксі або віддаленому сервері — її уточнюють деталі винятку.
timeout_error: Тайм-аут означає перевищення строку очікування, а не обов’язково розрив зв’язку. Операція може чекати
  мережу, блокування чи повільний локальний ресурс.
broken_pipe_error: Запис у канал можливий, поки є відкритий одержувач. Якщо читач закрив свій кінець каналу, наступний
  запис завершується BrokenPipeError.
memory_error: Python виділяє пам’ять для об’єктів динамічно. Помилка виникає, якщо алокатор або ОС не можуть виділити
  потрібний блок; збільшення пам’яті не виправить алгоритм, що безмежно накопичує дані.
tab_error: Візуально однаковий відступ не завжди означає однакові символи. Табуляції та пробіли можуть виглядати
  рівно, але утворювати суперечливі рівні блоку.
lookup_error: LookupError — спільний предок помилок пошуку за ключем та індексом. Конкретний підклас показує, чи
  це був словник, чи послідовність.
arithmetic_error: ArithmeticError — базовий клас збоїв числових операцій, наприклад ділення на нуль або переповнення.
  За прямого використання потрібні повідомлення та місце обчислення.
overflow_error: Цілі числа Python можуть бути дуже великими, але інші числові формати й розширення обмежені діапазоном.
  Вихід за нього під час обчислення чи перетворення спричиняє OverflowError.
floating_point_error: 'FloatingPointError залежить від числової бібліотеки й налаштованих пасток помилок. Звичайні
  float-операції не завжди його викликають: це визначають налаштування обробки числових подій.'
reference_error: Слабке посилання не утримує об’єкт у пам’яті. Після видалення останнього сильного посилання та
  збирання об’єкта проксі не може передавати звернення до його атрибутів.
environment_error: EnvironmentError у сучасному Python — історичний псевдонім OSError. Причину потрібно шукати в
  errno та повідомленні операційної системи.
io_error: IOError у сучасному Python є псевдонімом OSError. Невдала операція читання, запису чи доступу до файлу
  часто містить системні деталі в атрибутах винятку.
filesystem_exists_error: Ексклюзивне створення файлу вимагає вільного шляху. Якщо об’єкт уже існує, ОС відхиляє
  створення замість неявного перезапису.
process_lookup_error: Ідентифікатор процесу існує лише протягом його роботи. Після завершення PID може стати недійсним,
  а сигнал чи запит стану завершиться помилкою.
child_process_error: Батьківський процес може очікувати лише дочірні процеси, якими керує та статуси яких ще не
  забрав. Невідповідність стану призводить до помилки керування процесами.
interrupted_error: Сигнал може перервати блокувальний системний виклик. Частина викликів повторюється автоматично,
  але операції з частковим результатом не можна повторювати без перевірки.
blocking_io_error: Неблокувальне введення-виведення повертає керування одразу. Якщо даних немає чи буфер заповнений,
  операція повідомляє, що потрібно дочекатися готовності ресурсу.
not_implemented_error: NotImplementedError зазвичай явно викликається кодом, наприклад в абстрактному методі. Це
  не те саме, що спеціальне значення NotImplemented під час перевантаження операторів.
system_error: SystemError зазвичай означає внутрішній збій CPython чи розширення, а не звичайний невірний аргумент
  користувача. Важливо зафіксувати середовище та відтворюваний виклик.
system_exit: SystemExit — нащадок BaseException, що виникає під час sys.exit(). Якщо його не перехопити, процес
  завершиться з указаним кодом замість звичайної обробки помилок застосунку.
keyboard_interrupt: KeyboardInterrupt зазвичай пов’язаний із сигналом SIGINT під час виконання Python. Він успадковує
  BaseException, тому обробник except Exception його не перехоплює.
generator_exit: GeneratorExit передається генератору під час закриття. Генератор має звільнити ресурси й завершитися,
  не повертаючи нових значень під час фіналізації.
stop_iteration: Протокол ітераторів використовує StopIteration як сигнал завершення даних. Цикл for обробляє його
  сам, але прямий next() може передати виняток викликувачеві.
stop_async_iteration: Протокол асинхронної ітерації використовує StopAsyncIteration для завершення async for. Це
  звичайний сигнал кінця з __anext__, а не завжди помилка програми.
exception_group: ExceptionGroup містить кілька Exception із можливою вкладеністю, часто після паралельних завдань.
  Конструкція except* обробляє відповідну підгрупу, не приховуючи інших помилок.
base_exception_group: BaseExceptionGroup може містити нащадків BaseException, які не є звичайними Exception. Тому
  обробка має враховувати сигнали переривання та виходу.
async_cancelled_error: В asyncio скасування передається завданню в точці await. Це частина керування життєвим циклом
  завдань; після звільнення ресурсів скасування зазвичай не пригнічують.
async_timeout_error: Тайм-аут async обмежує час виконання await. Після завершення строку внутрішнє завдання можуть
  скасувати, а викликувач отримає TimeoutError.
subprocess_called_process_error: subprocess.run(..., check=True) викликає CalledProcessError за ненульового коду
  дочірнього процесу. Код виходу й stderr належать зовнішній програмі, а не самому інтерпретатору Python.
subprocess_timeout_expired: Тайм-аут subprocess обмежує очікування дочірнього процесу. До завершення строку процес
  міг уже вивести частину даних або потребувати окремої зупинки.
config_parser_error: ConfigParser читає INI-розділи й параметри. Неправильні заголовки, повторювані записи та підстановки
  можуть спричиняти збій розбору чи пошуку.
argparse_argument_error: argparse перевіряє визначення та значення параметрів під час створення й роботи парсера.
  Повідомлення показує, чи стосується помилка налаштування CLI, чи вхідних аргументів.
argparse_exit: argparse завершує роботу через parser.exit() після --help або помилки аргументів. Код 0 зазвичай
  означає довідку, код 2 — некоректне введення.
dataclass_frozen_instance_error: Заморожений dataclass створює методи, що забороняють звичайне присвоєння полям
  після створення об’єкта. Для зміни даних потрібен інший екземпляр.
pydantic_validation_error: Pydantic зіставляє вхідні дані зі схемою полів, застосовуючи перетворення типів і валідатори.
  Шлях помилки вказує на поле та порушене обмеження.
pydantic_user_error: PydanticUserError означає помилку оголошення моделі чи використання API, а не погані вхідні
  дані. Підтримувані налаштування й валідатори залежать від версії бібліотеки.
django_template_does_not_exist: Django шукає шаблони через налаштовані рушії, каталоги й завантажувачі застосунків.
  Назва шаблону має відповідати одному з цих шляхів пошуку.
django_object_does_not_exist: Django ORM викликає DoesNotExist під час пошуку рівно одного об’єкта без збігів. Порожній
  результат запиту — не те саме, що знайдений запис із порожнім полем.
django_model_does_not_exist: Model.objects.get() очікує рівно один рядок. Якщо жоден запис не підходить, Django
  викликає клас DoesNotExist моделі замість повернення None.
django_multiple_objects_returned: Model.objects.get() вимагає рівно один результат. Коли запит знаходить кілька
  рядків, Django викликає MultipleObjectsReturned замість вибору випадкового запису.
django_integrity_error: Django передає SQL-записи драйверу бази даних. Унікальність, зовнішні ключі та інші обмеження
  перевіряє СУБД, а порушення перетворюється на IntegrityError.
sqlalchemy_integrity_error: SQLAlchemy передає помилку обмеження від драйвера БД. Початкова DBAPI-помилка зазвичай
  містить назву обмеження, ключа чи таблиці.
sqlalchemy_programming_error: SQLAlchemy надсилає SQL через діалект і драйвер бази. ProgrammingError зазвичай означає
  невідому колонку, таблицю чи конструкцію SQL для фактичної схеми.
sqlalchemy_no_result_found: Методи на кшталт one() вимагають рівно один рядок. Якщо набір результатів порожній,
  SQLAlchemy викликає NoResultFound замість повернення None.
sqlalchemy_multiple_results_found: Методи на кшталт one() перевіряють кількість результатів. MultipleResultsFound
  означає, що запит повернув кілька рядків замість одного.
requests_connection_error: requests використовує urllib3 і сокети для HTTP-підключення. За збою з’єднання коректного
  HTTP-статусу не отримано, тому обробка помилок за response може не спрацювати.
requests_timeout: requests розрізняє тайм-аут підключення й читання. Перший стосується встановлення зв’язку, другий
  — очікування даних після підключення.
requests_http_error: requests викликає HTTPError за raise_for_status() на неуспішній HTTP-відповіді. Об’єкт response
  вже існує, його статус і тіло містять деталі причини.
urllib_url_error: 'urllib викликає URLError за транспортних збоїв: DNS, TLS або недоступності хоста. Атрибут reason
  часто містить початкову мережеву помилку.'
urllib_http_error: urllib HTTPError містить деталі HTTP-відповіді. На відміну від URLError за мережевого збою, тут
  сервер відповів, але повернув неуспішний статус.
numpy_axis_error: NumPy нумерує осі від нуля до ndim - 1 (допускаються й від’ємні індекси). Вісь за межами цього
  діапазону не існує для заданої форми масиву.
pandas_key_error: Pandas використовує іменовані індекси для стовпців і рядків. Пошук за міткою залежить від точної
  назви й рівня індексу, а не від візуального розташування значення.
pandas_parser_error: Парсери CSV й подібних форматів визначають поля за роздільниками, лапками й кодуванням. Неправильний
  роздільник або лапки змінюють кількість стовпців рядка.
pytest_failed_assertion: pytest переписує assert для показу порівнюваних виразів і значень. Провал перевірки означає
  розбіжність очікувань і результату, а не обов’язково збій pytest.
pytest_skipped: 'pytest може пропускати тести через pytest.skip(), декоратори та маркери умов. Це не провал: тіло
  тесту могло взагалі не виконуватися.'
click_exception: Click обробляє аргументи CLI та викликає ClickException за збою команди. Його повідомлення про
  помилку зазвичай корисніше за загальний кадр Python traceback.
typer_bad_parameter: Typer будує розбір CLI на Click. BadParameter виникає, коли значення не вдається перетворити
  чи перевірити за типом параметра й правилами callback.
flask_bad_request: Werkzeug викликає BadRequest за неправильних чи неповних HTTP-даних. Звернення request.form[key]
  може викликати виняток замість повернення None, якщо ключ відсутній.
jwt_decode_error: JWT складається із закодованих частин, розділених крапками. Помилка декодування може стосуватися
  base64url, JSON, алгоритму чи перевірки підпису.
jwt_expired_signature: Строк дії JWT перевіряється за полем exp як часовою позначкою. Токен із правильною підписом
  усе одно недійсний після завершення строку.
yaml_error: YAML кодує словники й списки відступами та знаками. Парсер часто вказує біля неправильного ключа, значення
  чи переходу рівнів відступів.
toml_decode_error: TOML суворо визначає синтаксис ключів, рядків та заголовків таблиць. Неправильний запис робить
  конфігурацію недійсною, навіть якщо вона схожа на INI.
importlib_metadata_package_not_found: importlib.metadata шукає метадані встановленого дистрибутива, а не просто
  імпортований файл. Локальний модуль може імпортуватися, хоча distribution(name) не знайде пакет.
django_improperly_configured: Django перевіряє налаштування під час запуску й доступу до сервісів. Відсутні змінні
  середовища, записи застосунків і несумісні налаштування можуть спричинити ImproperlyConfigured.
django_no_reverse_match: Зворотна побудова URL зіставляє назву маршруту й аргументи шаблону шляху. Помилка namespace,
  назви чи параметрів спричиняє NoReverseMatch.
fastapi_response_validation_error: FastAPI перевіряє повернені endpoint дані за response_model після виконання обробника.
  Сам обробник може завершитися, але серіалізація впаде через невідповідність полів чи типів.
sqlalchemy_operational_error: SQLAlchemy обгортає DBAPI-помилки підключення та виконання запитів. OperationalError
  може означати мережу, авторизацію, недоступність СУБД чи збій операції драйвера.
django_command_error: Команди керування Django викликають CommandError за невірних аргументів чи невиконаних вимог
  проєкту. Повідомлення вказує на конкретну перевірку команди, а не на синтаксис Python.
alembic_command_error: Alembic управляє графом ревізій міграцій і станом бази даних. CommandError виникає, коли
  неможливо визначити ревізію, конфігурацію чи залежності міграцій.
pytest_fixture_lookup_error: pytest шукає фікстури за назвою в тесті, conftest.py та плагінах. Якщо жодне доступне
  джерело не визначило назву, виникає FixtureLookupError.
aiogram_telegram_bad_request: aiogram надсилає запити Telegram API та викликає TelegramBadRequest за відхилення
  сервером. Опис Telegram зазвичай вказує неправильний chat, message чи параметр.
pytelegrambotapi_api_exception: pyTelegramBotAPI обгортає помилки Telegram API в ApiTelegramException. Статус та
  опис API пояснюють, чому запит відхилено.
