syntax_error: Python не может понять, как записана эта часть программы.
indentation_error: Строки кода расположены с отступами, которые Python не может разобрать.
module_not_found: Python ищет модуль `{module}`, но не находит его в текущем окружении.
import_error_circular: Два Python-файла зависят друг от друга ещё до завершения загрузки.
import_error: Python нашёл файл, но не смог получить из него нужное имя.
name_error: Python встретил `{name}`, но не знает, что означает это имя.
type_error_missing_argument: При вызове функции ей не передали обязательное значение.
type_error_unexpected_keyword: Функции передали имя аргумента, которого она не понимает.
type_error_not_callable: Программа попыталась вызвать обычное значение как функцию.
type_error_not_subscriptable: Программа попробовала обратиться к значению через квадратные скобки, но так делать
  нельзя.
type_error_not_iterable: Программа попыталась перебрать значение, которое нельзя перебирать.
type_error_unsupported_operand: Эти значения нельзя соединить выбранной операцией.
type_error_multiple_values: Функция получила один и тот же аргумент несколько раз.
type_error: Python не может выполнить эту операцию с переданным значением.
value_error_invalid_literal: Python не может прочитать эту строку как число.
value_error: Значение имеет подходящий тип, но не подходит для этой операции.
attribute_error_none: Программа ожидала объект, но получила `None`.
attribute_error: У объекта нет свойства или метода с таким названием.
key_error: Программа запросила в словаре ключ, которого там нет.
index_error: Программа пытается получить элемент за пределами списка.
file_not_found: Python пытается открыть файл или папку, которых не находит.
permission_error: Операционная система запретила доступ к ресурсу.
zero_division_error: Программа попыталась разделить число на ноль.
recursion_error: Функция слишком много раз вызвала саму себя, не остановившись.
unicode_decode_error: Python не может прочитать байты как текст в выбранной кодировке.
json_decode_error: Текст нарушает правила записи JSON.
unbound_local_error: Локальную переменную пытаются прочитать до присваивания.
assertion_error: Проверка условия в программе показала, что оно неверно.
