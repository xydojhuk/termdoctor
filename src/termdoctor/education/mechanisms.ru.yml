syntax_error: Разбор синтаксиса происходит до выполнения кода модуля. Если токены не соответствуют грамматике Python,
  интерпретатор не может построить синтаксическое дерево.
indentation_error: Отступы — часть грамматики Python. Токены INDENT и DEDENT должны соответствовать структуре блоков
  после составных инструкций.
module_not_found: Система импорта ищет модуль через sys.meta_path и пути sys.path. Пакеты другого интерпретатора
  или виртуального окружения могут быть недоступны текущему процессу.
import_error_circular: Python добавляет модуль в sys.modules до выполнения всех его инструкций. Повторный импорт
  может увидеть частично инициализированный модуль без нужного имени.
import_error: Поиск модуля и поиск конкретного имени внутри него — разные действия. Модуль может загрузиться, хотя
  нужное имя отсутствует или ещё не создано.
name_error: 'Python ищет имя в доступных пространствах имён: локальном, внешних областях функций, глобальном и встроенном.
  Если связать имя со значением не удалось, возникает NameError. Ещё не выполненное присваивание не создаёт имя.'
type_error_missing_argument: Перед выполнением функции Python связывает позиционные и именованные аргументы с её
  параметрами. Если обязательный параметр остался без значения, ошибка возникает ещё до запуска тела функции.
type_error_unexpected_keyword: Именованные аргументы сверяются с сигнатурой функции. Если функция не принимает дополнительные
  ключи через **kwargs, неизвестное имя не может быть связано с параметром.
type_error_not_callable: Вызов x() использует протокол вызова объекта. Значение должно поддерживать вызов; наличие
  данных в переменной само по себе не делает значение функцией.
type_error_not_subscriptable: Выражение x[key] обращается к протоколу индексации, обычно __getitem__. Типы без этой
  операции нельзя индексировать.
type_error_not_iterable: Цикл for получает итератор через iter(). Объект должен поддерживать протокол итерации;
  одного наличия значения недостаточно.
type_error_unsupported_operand: Python выбирает реализацию оператора по типам операндов. Если совместимый метод
  не найден, операция вызывает TypeError.
type_error_multiple_values: Связывание аргументов присваивает каждому параметру одно значение. Позиционный и именованный
  аргументы могут случайно попасть в один параметр.
type_error: TypeError сообщает о несовместимости операции и типов объектов. Данные могут быть корректными по отдельности,
  но операция не определена для их сочетания.
value_error_invalid_literal: Функция преобразования получает строку, а затем разбирает запись числа. Недопустимый
  символ или формат приводит к ошибке разбора.
value_error: ValueError означает, что тип аргумента допустим, но конкретное содержимое нарушает ограничение функции.
attribute_error_none: None — специальное значение отсутствия результата. У него нет прикладных методов и полей ожидаемого
  объекта.
attribute_error: Доступ к атрибутам проходит через правила поиска экземпляра и класса, включая дескрипторы. Отсутствующее
  имя приводит к AttributeError.
key_error: Обращение к словарю ищет ключ по правилам сравнения и хеширования. Не добавленный ключ или ключ другого
  типа через обычную индексацию не находится.
index_error: Индексы последовательностей начинаются с нуля и должны попадать в допустимый диапазон. Отрицательные
  индексы считают с конца, но тоже должны указывать на существующий элемент.
file_not_found: Относительный путь вычисляется от рабочей директории процесса, а не обязательно от папки Python-файла.
permission_error: Операционная система проверяет владельца и права процесса при доступе к ресурсу. Если системный
  вызов отклонён, Python выдаёт PermissionError.
zero_division_error: Делитель вычисляется до самого деления. Если он равен нулю, операция недопустима и Python вызывает
  ZeroDivisionError.
recursion_error: Каждый рекурсивный вызов добавляет кадр стека. Если рекурсия не завершается, глубина превысит установленный
  предел Python.
unicode_decode_error: Декодирование сопоставляет байты символам Unicode согласно кодировке. Недопустимую последовательность
  байтов нельзя прочесть без особого режима обработки ошибок.
json_decode_error: Парсер JSON ожидает строгую грамматику с двойными кавычками у строк и правильными разделителями.
  Запись Python не равнозначна JSON.
unbound_local_error: Присваивание имени внутри функции обычно делает его локальным во всём теле функции. Чтение
  до выполнения присваивания вызывает UnboundLocalError.
assertion_error: Оператор assert проверяет выражение и вызывает AssertionError при ложном результате. Он предназначен
  для внутренних инвариантов, а не для проверки недоверенного ввода.
runtime_error: RuntimeError возникает, когда операция не может продолжаться в текущем состоянии и более точного
  класса ошибки нет. Причину помогают определить сообщение и стек вызовов.
os_error: OSError отражает сбой системной операции. Поля errno, filename и strerror помогают отличить отсутствие
  ресурса от проблем с правами или параметрами системного вызова.
is_a_directory_error: Объект по указанному пути может существовать, но быть не того типа. Операция чтения обычного
  файла не может использовать каталог как файл.
not_a_directory_error: Путь обрабатывается по частям. Каждый промежуточный компонент должен быть каталогом, иначе
  переход к следующей части невозможен.
eof_error: input() и другие функции чтения вызывают EOFError, если запрашивают данные после конца потока. Такое
  бывает при перенаправленном или закрытом stdin.
connection_error: Ошибка подключения возникает ещё до получения корректного ответа приложения. Причина может быть
  в DNS, TCP, TLS, прокси или удалённом сервере — её уточняют детали исключения.
timeout_error: Тайм-аут означает превышение срока ожидания, а не обязательно обрыв связи. Операция может ждать сеть,
  блокировку или медленный локальный ресурс.
broken_pipe_error: Запись в канал возможна, пока есть открытый получатель. Если читатель закрыл свой конец канала,
  следующая запись завершается BrokenPipeError.
memory_error: Python выделяет память для объектов динамически. Ошибка возникает, если аллокатор или ОС не могут
  выделить нужный блок; увеличение памяти не исправит алгоритм, бесконечно накапливающий данные.
tab_error: Визуально одинаковый отступ не всегда означает одинаковые символы. Табуляции и пробелы могут выглядеть
  ровно, но образовывать противоречивые уровни блока.
lookup_error: LookupError — общий предок ошибок поиска по ключу и индексу. Конкретный подкласс показывает, был ли
  это словарь или последовательность.
arithmetic_error: ArithmeticError — базовый класс сбоев числовых операций, например деления на ноль или переполнения.
  При прямом использовании нужны сообщение и место вычисления.
overflow_error: Целые числа Python могут быть очень большими, но другие числовые форматы и расширения ограничены
  диапазоном. Выход за него при вычислении или преобразовании вызывает OverflowError.
floating_point_error: 'FloatingPointError зависит от числовой библиотеки и настроенных ловушек ошибок. Обычные float-операции
  не всегда его вызывают: это определяют настройки обработки числовых событий.'
reference_error: Слабая ссылка не удерживает объект в памяти. После удаления последней сильной ссылки и сборки объекта
  прокси не может передавать обращения к его атрибутам.
environment_error: EnvironmentError в современном Python — исторический псевдоним OSError. Причину нужно искать
  в errno и сообщении операционной системы.
io_error: IOError в современном Python является псевдонимом OSError. Неудачная операция чтения, записи или доступа
  к файлу часто содержит системные детали в атрибутах исключения.
filesystem_exists_error: Эксклюзивное создание файла требует свободного пути. Если объект уже существует, ОС отклоняет
  создание вместо неявной перезаписи.
process_lookup_error: Идентификатор процесса существует только во время его жизни. После завершения PID может стать
  недействительным, и сигнал или запрос состояния завершится ошибкой.
child_process_error: Родитель может ожидать только дочерние процессы, которыми управляет и статусы которых ещё не
  забрал. Несоответствие состояния приводит к ошибке управления процессами.
interrupted_error: Сигнал может прервать блокирующий системный вызов. Часть вызовов повторяется автоматически, но
  операции с частичным результатом нельзя повторять без проверки.
blocking_io_error: Неблокирующий ввод-вывод возвращает управление сразу. Если данных нет или буфер заполнен, операция
  сообщает, что нужно дождаться готовности ресурса.
not_implemented_error: NotImplementedError обычно явно вызывается кодом, например в абстрактном методе. Это не то
  же самое, что специальное значение NotImplemented при перегрузке операторов.
system_error: SystemError обычно означает внутренний сбой CPython или расширения, а не обычный неверный аргумент
  пользователя. Важно зафиксировать окружение и воспроизводимый вызов.
system_exit: SystemExit — наследник BaseException, возникающий при sys.exit(). Если его не перехватить, процесс
  завершится с указанным кодом вместо обычной обработки ошибок приложения.
keyboard_interrupt: KeyboardInterrupt обычно связан с сигналом SIGINT во время выполнения Python. Он наследует BaseException,
  поэтому обработчик except Exception его не перехватывает.
generator_exit: GeneratorExit передаётся генератору при закрытии. Генератор должен освободить ресурсы и завершиться,
  не возвращая новых значений при финализации.
stop_iteration: Протокол итераторов использует StopIteration как сигнал окончания данных. Цикл for обрабатывает
  его сам, но прямой next() может передать исключение вызывающему коду.
stop_async_iteration: Протокол асинхронной итерации использует StopAsyncIteration для завершения async for. Это
  нормальный сигнал конца из __anext__, а не всегда ошибка программы.
exception_group: ExceptionGroup содержит несколько Exception с возможной вложенностью, часто после параллельных
  задач. Конструкция except* обрабатывает подходящую подгруппу, не скрывая остальные ошибки.
base_exception_group: BaseExceptionGroup может содержать наследников BaseException, не являющихся обычными Exception.
  Поэтому обработка должна учитывать сигналы прерывания и выхода.
async_cancelled_error: В asyncio отмена передаётся задаче в точке await. Это часть управления жизненным циклом задач;
  после освобождения ресурсов отмену обычно не подавляют.
async_timeout_error: Тайм-аут async ограничивает время выполнения await. По истечении срока внутреннюю задачу могут
  отменить, а вызывающий код получит TimeoutError.
subprocess_called_process_error: subprocess.run(..., check=True) вызывает CalledProcessError при ненулевом коде
  дочернего процесса. Код выхода и stderr принадлежат внешней программе, а не самому интерпретатору Python.
subprocess_timeout_expired: Тайм-аут subprocess ограничивает ожидание дочернего процесса. До истечения срока процесс
  мог уже вывести часть данных или потребовать отдельной остановки.
config_parser_error: ConfigParser читает INI-разделы и параметры. Неправильные заголовки, повторяющиеся записи и
  подстановки могут приводить к сбою разбора или поиска.
argparse_argument_error: argparse проверяет определения и значения параметров при создании и работе парсера. Сообщение
  показывает, относится ошибка к настройке CLI или входным аргументам.
argparse_exit: argparse завершает работу через parser.exit() после --help или ошибки аргументов. Код 0 обычно означает
  справку, код 2 — некорректный ввод.
dataclass_frozen_instance_error: Замороженный dataclass создаёт методы, запрещающие обычное присваивание полям после
  создания объекта. Для изменения данных нужен другой экземпляр.
pydantic_validation_error: Pydantic сопоставляет входные данные со схемой полей, применяя преобразования типов и
  валидаторы. Путь ошибки указывает на поле и нарушенное ограничение.
pydantic_user_error: PydanticUserError говорит об ошибке объявления модели или использования API, а не о плохих
  входных данных. Поддерживаемые настройки и валидаторы зависят от версии библиотеки.
django_template_does_not_exist: Django ищет шаблоны через настроенные движки, каталоги и загрузчики приложений.
  Имя шаблона должно соответствовать одному из этих путей поиска.
django_object_does_not_exist: Django ORM вызывает DoesNotExist при поиске ровно одного объекта без совпадений. Пустой
  результат запроса — не то же самое, что найденная запись с пустым полем.
django_model_does_not_exist: Model.objects.get() ожидает ровно одну строку. Если ни одна запись не подходит, Django
  вызывает класс DoesNotExist модели вместо возврата None.
django_multiple_objects_returned: Model.objects.get() требует ровно один результат. Когда запрос находит несколько
  строк, Django вызывает MultipleObjectsReturned вместо выбора случайной записи.
django_integrity_error: Django передаёт SQL-записи драйверу базы данных. Уникальность, внешние ключи и другие ограничения
  проверяет СУБД, а нарушение превращается в IntegrityError.
sqlalchemy_integrity_error: SQLAlchemy передаёт ошибку ограничения от драйвера БД. Исходная DBAPI-ошибка обычно
  содержит имя ограничения, ключа или таблицы.
sqlalchemy_programming_error: SQLAlchemy отправляет SQL через диалект и драйвер базы. ProgrammingError обычно означает
  неизвестную колонку, таблицу или конструкцию SQL для реальной схемы.
sqlalchemy_no_result_found: Методы вроде one() требуют ровно одну строку. Если набор результатов пуст, SQLAlchemy
  вызывает NoResultFound вместо возврата None.
sqlalchemy_multiple_results_found: Методы вроде one() проверяют количество результатов. MultipleResultsFound означает,
  что запрос вернул несколько строк вместо одной.
requests_connection_error: requests использует urllib3 и сокеты для HTTP-подключения. При сбое соединения корректный
  HTTP-статус не получен, поэтому обработка ошибок по response может не сработать.
requests_timeout: requests различает тайм-аут подключения и чтения. Первый связан с установкой связи, второй — с
  ожиданием данных после подключения.
requests_http_error: requests вызывает HTTPError при raise_for_status() на неуспешном HTTP-ответе. Объект response
  уже существует, его статус и тело содержат детали причины.
urllib_url_error: 'urllib вызывает URLError при транспортных сбоях: DNS, TLS или недоступности хоста. Атрибут reason
  часто содержит исходную сетевую ошибку.'
urllib_http_error: urllib HTTPError содержит детали HTTP-ответа. В отличие от URLError при сетевом сбое, здесь сервер
  ответил, но вернул неуспешный статус.
numpy_axis_error: NumPy нумерует оси от нуля до ndim - 1 (допускаются и отрицательные индексы). Ось за пределами
  этого диапазона не существует для заданной формы массива.
pandas_key_error: Pandas использует именованные индексы для столбцов и строк. Поиск по метке зависит от точного
  имени и уровня индекса, а не от визуального положения значения.
pandas_parser_error: Парсеры CSV и похожих форматов определяют поля по разделителям, кавычкам и кодировке. Неверный
  разделитель или кавычка меняет число столбцов строки.
pytest_failed_assertion: pytest переписывает assert для показа сравниваемых выражений и значений. Провал проверки
  означает расхождение ожиданий и результата, а не обязательно сбой pytest.
pytest_skipped: 'pytest может пропускать тесты через pytest.skip(), декораторы и маркеры условий. Это не провал:
  тело теста могло вообще не выполняться.'
click_exception: Click обрабатывает аргументы CLI и вызывает ClickException при сбое команды. Его сообщение об ошибке
  обычно полезнее, чем общий кадр Python traceback.
typer_bad_parameter: Typer строит разбор CLI на Click. BadParameter возникает, когда значение не удаётся преобразовать
  или проверить по типу параметра и правилам callback.
flask_bad_request: Werkzeug вызывает BadRequest при неправильных или неполных HTTP-данных. Обращение request.form[key]
  может вызвать исключение вместо возврата None, если ключ отсутствует.
jwt_decode_error: JWT состоит из закодированных частей, разделённых точками. Ошибка декодирования может быть связана
  с base64url, JSON, алгоритмом или проверкой подписи.
jwt_expired_signature: Срок действия JWT проверяется по полю exp как временной метке. Токен с правильной подписью
  всё равно недействителен после истечения срока.
yaml_error: YAML кодирует словари и списки отступами и знаками. Парсер часто указывает рядом с неверным ключом,
  значением или переходом уровней отступов.
toml_decode_error: TOML строго задаёт синтаксис ключей, строк и заголовков таблиц. Неверная запись делает конфигурацию
  недействительной, даже если она похожа на INI.
importlib_metadata_package_not_found: importlib.metadata ищет метаданные установленного дистрибутива, а не просто
  импортируемый файл. Локальный модуль может импортироваться, хотя distribution(name) не найдёт пакет.
django_improperly_configured: Django проверяет настройки при запуске и доступе к сервисам. Отсутствующие переменные
  окружения, записи приложений и несовместимые настройки могут привести к ImproperlyConfigured.
django_no_reverse_match: Обратное построение URL сопоставляет имя маршрута и аргументы шаблону пути. Ошибка namespace,
  имени или параметров приводит к NoReverseMatch.
fastapi_response_validation_error: FastAPI проверяет возвращённые endpoint данные по response_model после выполнения
  обработчика. Сам обработчик может завершиться, но сериализация упадёт из-за несовпадения полей или типов.
sqlalchemy_operational_error: SQLAlchemy оборачивает DBAPI-ошибки подключения и выполнения запросов. OperationalError
  может означать сеть, авторизацию, недоступность СУБД или сбой операции драйвера.
django_command_error: Команды управления Django вызывают CommandError при неверных аргументах или невыполненных
  требованиях проекта. Сообщение указывает на конкретную проверку команды, а не на синтаксис Python.
alembic_command_error: Alembic управляет графом ревизий миграций и состоянием базы данных. CommandError возникает,
  когда не удаётся разрешить ревизию, настройки или зависимости миграций.
pytest_fixture_lookup_error: pytest ищет фикстуры по имени в тесте, conftest.py и плагинах. Если ни один доступный
  источник не определил имя, возникает FixtureLookupError.
aiogram_telegram_bad_request: aiogram отправляет запросы Telegram API и вызывает TelegramBadRequest при отклонении
  сервером. Описание Telegram обычно указывает неправильный chat, message или параметр.
pytelegrambotapi_api_exception: pyTelegramBotAPI оборачивает ошибки Telegram API в ApiTelegramException. Статус
  и описание API поясняют, почему запрос отклонён.
