syntax_error:
  title: Некоректний синтаксис Python
  explanation: 'Python не може розібрати конструкцію коду: один із символів або елементів записано неправильно.'
  causes:
  - Пропущено двокрапку після умови чи циклу
  - Не закрито дужку або лапки
  fixes:
  - Перевір рядок помилки та попередній рядок
  - Зістав дужки, лапки та двокрапки
indentation_error:
  title: Неправильні відступи
  explanation: Python визначає блоки коду за відступами, а тут їхня структура порушена.
  causes:
  - Рядок має зайвий або недостатній відступ
  - Змішані табуляції та пробіли
  fixes:
  - Вирівняй рядки одного блоку
  - Використовуй пробіли послідовно
module_not_found:
  title: Модуль не знайдено
  explanation: Python не знаходить модуль `{module}` у шляхах імпорту поточного середовища.
  causes:
  - Потрібний пакет відсутній у вибраному середовищі
  - Запущено інший інтерпретатор або використано неправильну назву імпорту
  fixes:
  - Перевір інтерпретатор і встановлені пакети
  - Звір назву імпорту та оголошені залежності
import_error_circular:
  title: Циклічний імпорт
  explanation: Модулі імпортують один одного до завершення власної ініціалізації.
  causes:
  - Два файли взаємно імпортують визначення
  - Локальний модуль перекриває ім’я іншого пакета
  fixes:
  - Винеси спільні визначення до незалежного модуля
  - Перевір назви файлів і напрямки імпортів
import_error:
  title: Помилка імпорту
  explanation: Модуль знайдено, але потрібний об’єкт не вдалося імпортувати.
  causes:
  - Ім’я відсутнє в модулі
  - Версія пакета або порядок імпортів не відповідає очікуванням
  fixes:
  - Звір ім’я з визначеннями модуля
  - Перевір циклічні імпорти та версію залежності
name_error:
  title: Невідоме ім’я
  explanation: Під час виконання Python не знайшов визначення імені `{name}` у доступних просторах імен.
  causes:
  - Опечатка в назві
  - Ім’я створено пізніше або в іншій області видимості
  fixes:
  - Перевір написання `{name}` і порядок виконання
  - Звір імпорти та область видимості
type_error_missing_argument:
  title: Відсутній обов’язковий аргумент
  explanation: Функцію викликано без одного чи кількох обов’язкових аргументів.
  causes:
  - Не передано параметр з оголошення функції
  - Метод викликано без потрібного екземпляра
  fixes:
  - Порівняй виклик із сигнатурою функції
  - Перевір параметри self та cls
type_error_unexpected_keyword:
  title: Невідомий іменований аргумент
  explanation: Функція не приймає переданий іменований параметр.
  causes:
  - Назву аргументу написано неправильно
  - Інша версія бібліотеки має іншу сигнатуру
  fixes:
  - Звір параметри у визначенні функції
  - Перевір версію бібліотеки й документацію
type_error_not_callable:
  title: Об’єкт неможливо викликати
  explanation: Круглі дужки використано для значення, яке не є викликуваним об’єктом.
  causes:
  - Ім’я функції перезаписано даними
  - Властивість помилково сприйнято за метод
  fixes:
  - Перевір тип значення перед викликом
  - Знайди присвоєння, що змінило ім’я
type_error_not_subscriptable:
  title: Об’єкт не підтримує індексацію
  explanation: Спроба доступу через квадратні дужки застосована до об’єкта без операції індексації.
  causes:
  - Значення не є індексованою колекцією
  - Використано неправильний тип об’єкта
  fixes:
  - Перевір type() значення
  - Звір спосіб доступу з API об’єкта
type_error_not_iterable:
  title: Об’єкт не можна перебрати
  explanation: Цикл або операція перебору отримали значення, яке не підтримує ітерацію.
  causes:
  - Замість колекції передано одиничне значення
  - Функція повернула None
  fixes:
  - Перевір значення перед циклом
  - Переконайся, що функція повертає потрібну колекцію
type_error_unsupported_operand:
  title: Несумісні типи операндів
  explanation: Оператор не визначений для поєднання переданих типів значень.
  causes:
  - Змішані рядок і число
  - Операція не підтримується об’єктом
  fixes:
  - Перевір типи з обох боків оператора
  - Застосуй сумісні типи або явне перетворення
type_error_multiple_values:
  title: Аргумент передано двічі
  explanation: Один параметр функції отримав кілька значень під час виклику.
  causes:
  - Одне значення передано позиційно й за ім’ям
  - Обгортка повторно передала аргумент
  fixes:
  - Зістав позиційні та іменовані аргументи
  - Перевір виклик методу та параметр self
type_error:
  title: Несумісний тип значення
  explanation: Операція або функція отримала значення типу, який не підтримує потрібну дію.
  causes:
  - Передано значення невідповідного типу
  - Застосовано операцію, не визначену для цього типу
  fixes:
  - Перевір типи аргументів та сигнатуру функції
  - Підбери сумісну операцію або перетворення
value_error_invalid_literal:
  title: Некоректний рядок для перетворення на число
  explanation: Числовий конструктор не може прочитати символи в переданому рядку.
  causes:
  - У рядку є зайві символи
  - Формат не відповідає основі системи числення
  fixes:
  - Перевір вміст рядка й пробіли
  - Звір очікуваний формат числа
value_error:
  title: Недопустиме значення
  explanation: Тип аргументу підходить, але саме значення порушує вимоги операції.
  causes:
  - Значення перебуває поза допустимим діапазоном
  - Аргумент має неправильний формат
  fixes:
  - Перевір допустимі значення функції
  - Порівняй фактичний аргумент з обмеженнями
attribute_error_none:
  title: Замість об’єкта отримано None
  explanation: Код звертається до атрибута значення None, у якого немає очікуваного інтерфейсу.
  causes:
  - Функція не повернула очікуваний об’єкт
  - Результат пошуку виявився порожнім
  fixes:
  - Перевір місце присвоєння значення
  - Оброби відсутній результат до звернення до атрибута
attribute_error:
  title: Атрибут відсутній
  explanation: Об’єкт не має атрибута з указаним ім’ям.
  causes:
  - Назву атрибута написано неправильно
  - Об’єкт має інший тип або структуру
  fixes:
  - Перевір фактичний тип об’єкта
  - Зістав ім’я атрибута з доступним API
key_error:
  title: Ключа немає в словнику
  explanation: Словник або відображення не містить запитаного ключа `{key}`.
  causes:
  - Ключ названо інакше
  - Дані мають іншу структуру
  fixes:
  - Перевір наявні ключі
  - Використовуй безпечне отримання значення, якщо ключ необов’язковий
index_error:
  title: Індекс поза межами колекції
  explanation: Звернення за індексом виходить за межі наявних елементів.
  causes:
  - Колекція коротша, ніж очікувалося
  - Переплутано індексацію з нуля
  fixes:
  - Перевір len() колекції
  - Зістав індекс із допустимими межами
file_not_found:
  title: Файл або теку не знайдено
  explanation: Операційна система не знайшла вказаний шлях.
  causes:
  - Шлях написано неправильно
  - Відносний шлях обчислено з іншої робочої теки
  fixes:
  - Перевір абсолютний шлях і поточну теку
  - Переконайся, що файл існує
permission_error:
  title: Немає дозволу на доступ
  explanation: Операційна система відмовила процесу в доступі до ресурсу.
  causes:
  - Користувач не має потрібних прав
  - Файл або директорія захищені
  fixes:
  - Перевір власника й права доступу
  - Використовуй ресурс із належними дозволами
zero_division_error:
  title: Ділення на нуль
  explanation: Арифметична операція намагається використати нуль як дільник.
  causes:
  - Дільник обчислився як нуль
  - Вхідні дані містять недопустиме значення
  fixes:
  - Перевір розрахунок дільника
  - Оброби нуль до виконання ділення
recursion_error:
  title: Перевищено глибину рекурсії
  explanation: Вкладених викликів функції стало більше, ніж дозволено налаштуваннями інтерпретатора.
  causes:
  - Відсутня умова зупинки
  - Рекурсивні виклики не наближаються до завершення
  fixes:
  - Перевір базовий випадок рекурсії
  - Простеж зміну аргументів при кожному виклику
unicode_decode_error:
  title: Помилка декодування тексту
  explanation: Послідовність байтів не може бути прочитана з вибраним кодуванням.
  causes:
  - Файл має інше кодування
  - Дані пошкоджені або неповні
  fixes:
  - Визнач кодування джерела
  - Вкажи правильне encoding під час читання
json_decode_error:
  title: Некоректний JSON
  explanation: Парсер не зміг розібрати JSON-документ через порушення синтаксису.
  causes:
  - Пропущено лапки або кому
  - Передано порожній чи не-JSON текст
  fixes:
  - Перевір позицію помилки
  - Переконайся, що вхід містить коректний JSON
unbound_local_error:
  title: Локальну змінну прочитано до присвоєння
  explanation: Python вважає ім’я локальним, але в поточній гілці виконання значення ще не присвоєно.
  causes:
  - Присвоєння відбувається лише за умовою
  - Локальне ім’я перекриває зовнішнє
  fixes:
  - Перевір усі шляхи виконання функції
  - Знайди присвоєння того самого імені
assertion_error:
  title: Перевірка assert не пройшла
  explanation: Умова оператора assert виявилася хибною.
  causes:
  - Фактичні дані не відповідають припущенню
  - Помилкове очікування в тесті
  fixes:
  - Порівняй фактичне та очікуване значення
  - Перевір умову assert
runtime_error:
  title: Помилка під час виконання
  explanation: Під час роботи програми виникла помилка стану, не представлена конкретнішим винятком.
  causes:
  - Операцію виконано в недопустимому стані
  - Бібліотека явно повідомила про збій
  fixes:
  - Прочитай повне повідомлення помилки
  - Знайди виклик, який змінив стан перед збоєм
os_error:
  title: Помилка операційної системи
  explanation: Системна операція з файлом, процесом або іншим ресурсом завершилася невдало.
  causes:
  - Ресурс недоступний
  - Системний виклик отримав некоректний параметр
  fixes:
  - Перевір код і текст системної помилки
  - Зістав шлях, права та стан ресурсу
is_a_directory_error:
  title: Очікувався файл, отримано теку
  explanation: Операція над файлом отримала шлях до директорії.
  causes:
  - Замість файлу вибрано теку
  - Шлях сформовано неправильно
  fixes:
  - Перевір тип об’єкта за шляхом
  - Укажи шлях до файлу, а не теки
not_a_directory_error:
  title: Очікувалася тека, отримано файл
  explanation: Один із компонентів шляху повинен бути директорією, але є файлом.
  causes:
  - Файл використано як проміжну директорію
  - Помилка у побудові шляху
  fixes:
  - Перевір кожну частину шляху
  - Вкажи фактичну директорію
eof_error:
  title: Неочікувано завершився ввід
  explanation: Програма очікувала нові дані, але потік вводу вже закінчився.
  causes:
  - Вхідний потік закрито
  - Програма прочитала всі дані
  fixes:
  - Перевір джерело вводу
  - Оброби завершення потоку
connection_error:
  title: Не вдалося встановити мережеве з’єднання
  explanation: Операція з мережевим підключенням завершилася невдало.
  causes:
  - Сервер недоступний
  - З’єднання розірвано мережею
  fixes:
  - Перевір адресу та порт
  - Перевір доступність сервера й мережі
timeout_error:
  title: Перевищено час очікування
  explanation: Операція не завершилася протягом відведеного часу.
  causes:
  - Сервер або ресурс відповідає повільно
  - Операція заблокована
  fixes:
  - Перевір час і місце очікування
  - Встанови обґрунтований тайм-аут або повторну спробу
broken_pipe_error:
  title: Канал передавання даних закрито
  explanation: Запис виконується в канал, читач якого вже припинив роботу.
  causes:
  - Одержувач завершив процес
  - Мережеве з’єднання закрито
  fixes:
  - Перевір стан одержувача
  - Оброби розрив перед повторним записом
memory_error:
  title: Недостатньо пам’яті
  explanation: Процес не зміг виділити необхідний обсяг оперативної пам’яті.
  causes:
  - Занадто великий об’єкт
  - Необмежене накопичення даних
  fixes:
  - Перевір розміри об’єктів
  - Обробляй дані частинами
tab_error:
  title: Змішані табуляції та пробіли
  explanation: Python не може однозначно визначити відступи через різні символи вирівнювання.
  causes:
  - Одні рядки містять табуляції, інші пробіли
  - Фрагмент коду вставлено з іншим форматуванням
  fixes:
  - Перетвори відступи на пробіли
  - Перевір увесь проблемний блок
lookup_error:
  title: Не вдалося знайти елемент
  explanation: Запитаний ключ чи індекс відсутній у джерелі даних.
  causes:
  - Запит не відповідає вмісту колекції
  - Використано неправильний індекс
  fixes:
  - Перевір доступні ключі та індекси
  - Оброби відсутнє значення
arithmetic_error:
  title: Помилка арифметичної операції
  explanation: Числове обчислення не вдалося виконати.
  causes:
  - Операція має недопустимі аргументи
  - Числова бібліотека відхилила результат
  fixes:
  - Перевір початкові значення
  - Зістав операцію з числовими обмеженнями
overflow_error:
  title: Число поза допустимим діапазоном
  explanation: Результат обчислення занадто великий для потрібного числового представлення.
  causes:
  - Надмірно велике значення
  - Перетворення у формат з обмеженим діапазоном
  fixes:
  - Перевір масштаб обчислення
  - Використовуй відповідний числовий формат
floating_point_error:
  title: Помилка обчислення з рухомою комою
  explanation: Числова операція з рухомою комою спричинила виняткову умову.
  causes:
  - Недопустимий числовий результат
  - Увімкнено сувору обробку числових помилок
  fixes:
  - Перевір вхідні значення
  - З’ясуй, які числові винятки налаштовано
reference_error:
  title: Об’єкт за слабким посиланням уже зник
  explanation: Слабке посилання більше не вказує на живий об’єкт.
  causes:
  - Об’єкт звільнено збирачем сміття
  - Не збережено сильне посилання
  fixes:
  - Перевір життєвий цикл об’єкта
  - Не використовуй слабке посилання після видалення об’єкта
environment_error:
  title: Помилка системного середовища
  explanation: Операція з ресурсом ОС або середовищем завершилася невдало.
  causes:
  - Потрібний системний ресурс відсутній
  - Конфігурація середовища некоректна
  fixes:
  - Перевір системне повідомлення
  - Перевір шляхи, змінні та права доступу
io_error:
  title: Помилка читання або запису
  explanation: Введення чи виведення даних завершилося невдало.
  causes:
  - Джерело даних недоступне
  - Ресурс закрито або пошкоджено
  fixes:
  - Перевір стан файлу чи потоку
  - Перевір права та коректність операції
filesystem_exists_error:
  title: Файл або тека вже існує
  explanation: Створення нового об’єкта не вдалося, оскільки шлях уже зайнятий.
  causes:
  - За шляхом існує файл
  - Операція забороняє перезапис
  fixes:
  - Перевір наявний об’єкт
  - Вибери новий шлях або дозволену стратегію заміни
process_lookup_error:
  title: Процес не знайдено
  explanation: Операційна система не знайшла процес із указаним ідентифікатором.
  causes:
  - Процес уже завершився
  - Передано неправильний PID
  fixes:
  - Перевір, чи існує процес
  - Не використовуй застарілий PID
child_process_error:
  title: Помилка дочірнього процесу
  explanation: Операція керування дочірнім процесом не відповідає його поточному стану.
  causes:
  - Дочірній процес уже завершено
  - Батьківський процес неправильно обробляє стан
  fixes:
  - Перевір дочірній PID та статус
  - Упорядкуй очікування завершення процесів
interrupted_error:
  title: Системну операцію перервано
  explanation: Системний виклик перервано сигналом або іншою подією.
  causes:
  - Під час операції надійшов сигнал
  - Операція не підтримала автоматичне відновлення
  fixes:
  - Визнач джерело переривання
  - Повторюй операцію лише коли це безпечно
blocking_io_error:
  title: Неблокувальна операція тимчасово неможлива
  explanation: Ресурс поки не готовий до читання чи запису без очікування.
  causes:
  - Немає доступних даних
  - Буфер запису заповнений
  fixes:
  - Дочекайся готовності ресурсу
  - Використай механізм оповіщення або повторення
not_implemented_error:
  title: Можливість не реалізовано
  explanation: Викликаний шлях коду навмисно повідомляє, що функціональність відсутня.
  causes:
  - Абстрактний метод не перевизначено
  - Частина функції залишена заглушкою
  fixes:
  - Знайди місце raise NotImplementedError
  - Реалізуй потрібний метод у відповідному класі
system_error:
  title: Внутрішня помилка Python або розширення
  explanation: Інтерпретатор або нативне розширення повідомили про внутрішню неузгодженість.
  causes:
  - Помилка у C-розширенні
  - Порушено внутрішній стан інтерпретатора
  fixes:
  - Перевір повний traceback і версії пакетів
  - Спробуй відтворити проблему в ізольованому середовищі
system_exit:
  title: Програма запитала завершення
  explanation: Програма викликала механізм завершення з певним кодом виходу.
  causes:
  - Викликано sys.exit()
  - Парсер аргументів завершив виконання
  fixes:
  - Перевір місце завершення програми
  - Зістав код виходу з очікуваною поведінкою
keyboard_interrupt:
  title: Виконання перервано
  explanation: Програму зупинено сигналом переривання, зазвичай Ctrl+C.
  causes:
  - Користувач перервав виконання
  - Сигнал отримано під час блокувальної операції
  fixes:
  - Перевір, чи переривання було навмисним
  - За потреби забезпеч очищення ресурсів
generator_exit:
  title: Генератор закрито
  explanation: Генератор завершують, поки він перебуває в призупиненому стані.
  causes:
  - Викликано close()
  - Генератор звільняє ресурси під час завершення
  fixes:
  - Перевір керування життєвим циклом генератора
  - Використовуй finally для очищення
stop_iteration:
  title: Ітератор завершив перебір
  explanation: Ітератор повідомив, що елементів більше немає.
  causes:
  - Дані в ітераторі закінчилися
  - next() викликано після останнього елемента
  fixes:
  - Перевір спосіб перебору
  - За потреби передай next() значення за замовчуванням
stop_async_iteration:
  title: Асинхронний ітератор завершив перебір
  explanation: Асинхронний ітератор повідомив, що наступного елемента немає.
  causes:
  - Асинхронне джерело даних вичерпано
  - Запитано зайвий елемент
  fixes:
  - Перевір асинхронний цикл
  - Оброби нормальне завершення ітератора
exception_group:
  title: Група винятків
  explanation: Кілька винятків об’єднано в один об’єкт ExceptionGroup.
  causes:
  - Кілька паралельних задач завершилися помилками
  - Помилки агреговано бібліотекою
  fixes:
  - Розглянь кожен вкладений виняток
  - Використовуй відповідну обробку except*
base_exception_group:
  title: Група базових винятків
  explanation: Об’єднано кілька базових винятків у BaseExceptionGroup.
  causes:
  - Група містить винятки поза звичайним Exception
  - Завершилися кілька операцій
  fixes:
  - Перевір типи всіх вкладених винятків
  - Обробляй їх відповідно до типу
async_cancelled_error:
  title: Асинхронне завдання скасовано
  explanation: Завдання asyncio отримало сигнал скасування.
  causes:
  - Інше завдання викликало cancel()
  - Скасування відбулося під час await
  fixes:
  - З’ясуй джерело скасування
  - Забезпеч коректне очищення ресурсів
async_timeout_error:
  title: Перевищено час очікування асинхронної операції
  explanation: Очікувана асинхронна операція не завершилася в заданий час.
  causes:
  - Віддалений ресурс відповідає повільно
  - Завдання заблокувалося
  fixes:
  - Перевір конкретний await
  - Відкоригуй тайм-аут або обробку скасування
subprocess_called_process_error:
  title: Дочірня команда завершилася з помилкою
  explanation: Зовнішня команда повернула ненульовий код завершення.
  causes:
  - Команда відхилила аргументи
  - У дочірньому процесі виникла помилка
  fixes:
  - Перевір stderr та код виходу
  - Повтори команду з коректними аргументами
subprocess_timeout_expired:
  title: Дочірній процес перевищив тайм-аут
  explanation: Запущена зовнішня команда не завершилася у відведений час.
  causes:
  - Команда зависла в очікуванні
  - Часу виконання недостатньо
  fixes:
  - Перевір стан дочірнього процесу
  - Налаштуй реалістичний тайм-аут
config_parser_error:
  title: Помилка читання конфігурації
  explanation: ConfigParser не зміг правильно обробити конфігураційний файл.
  causes:
  - Секція або параметр мають неправильний синтаксис
  - Параметр дублюється чи відсутній
  fixes:
  - Перевір рядок помилки у файлі
  - Зістав формат із вимогами INI
argparse_argument_error:
  title: Помилка визначення аргументу CLI
  explanation: Конфігурація або значення параметра командного рядка некоректні.
  causes:
  - Параметр має невідповідний тип
  - Оголошення аргументу суперечливе
  fixes:
  - Перевір опис аргументу в argparse
  - Зістав отримане значення з його типом
argparse_exit:
  title: Парсер аргументів завершив програму
  explanation: argparse завершив виконання через довідку або помилку параметрів.
  causes:
  - Передано невідомий параметр
  - Не вказано обов’язковий аргумент
  fixes:
  - Перевір повідомлення argparse
  - Звір фактичні аргументи з довідкою
dataclass_frozen_instance_error:
  title: Неможливо змінити заморожений dataclass
  explanation: Спроба змінити поле об’єкта dataclass із забороною присвоєння.
  causes:
  - Клас оголошено frozen=True
  - Код намагається змінити незмінний об’єкт
  fixes:
  - Перевір оголошення dataclass
  - Створюй новий екземпляр замість прямої зміни
pydantic_validation_error:
  title: Помилка валідації Pydantic
  explanation: Дані не задовольняють схему Pydantic-моделі.
  causes:
  - Поле має неправильний тип
  - Порушено обов’язковість або обмеження поля
  fixes:
  - Знайди поле й тип помилки
  - Зістав дані з визначенням моделі
pydantic_user_error:
  title: Помилка конфігурації Pydantic
  explanation: Визначення моделі або налаштування Pydantic суперечать її API.
  causes:
  - Використано несумісний параметр
  - Неправильно оголошено поле чи валідатор
  fixes:
  - Звір конфігурацію з версією Pydantic
  - Перевір оголошення полів
django_template_does_not_exist:
  title: Шаблон Django не знайдено
  explanation: Django не зміг знайти запитаний файл шаблону.
  causes:
  - Шлях до шаблону неправильний
  - Директорію не додано до пошуку шаблонів
  fixes:
  - Перевір розташування шаблону
  - Звір налаштування TEMPLATES та застосунків
django_object_does_not_exist:
  title: Об’єкт Django не знайдено
  explanation: Запит ORM не знайшов потрібного запису бази даних.
  causes:
  - Фільтр запиту не відповідає записам
  - Даних немає в поточній базі
  fixes:
  - Перевір фільтри пошуку
  - Урахуй відсутній запис у логіці програми
django_model_does_not_exist:
  title: Запис моделі Django не знайдено
  explanation: Метод ORM очікував один запис, але не знайшов жодного.
  causes:
  - Фільтри не відповідають даним
  - Запис було видалено
  fixes:
  - Перевір параметри get()
  - Використовуй обробку DoesNotExist
django_multiple_objects_returned:
  title: Запит Django повернув кілька записів
  explanation: Метод, який очікував один запис, знайшов декілька.
  causes:
  - Фільтр недостатньо точний
  - У таблиці є дублікати
  fixes:
  - Зроби критерій пошуку точнішим
  - Використовуй filter() для багатьох результатів
django_integrity_error:
  title: Порушення цілісності бази Django
  explanation: База даних відхилила запис через обмеження цілісності.
  causes:
  - Порушено унікальність
  - Зовнішній ключ посилається на відсутній запис
  fixes:
  - Перевір повідомлення бази даних
  - Перевір унікальні поля та зв’язки
sqlalchemy_integrity_error:
  title: Порушення обмеження бази SQLAlchemy
  explanation: SQL-операція порушила обмеження цілісності бази даних.
  causes:
  - Дублікат унікального значення
  - Недійсний зовнішній ключ
  fixes:
  - Прочитай помилку драйвера
  - Звір дані з обмеженнями схеми
sqlalchemy_programming_error:
  title: Помилка SQL або схеми в SQLAlchemy
  explanation: SQL-запит не відповідає синтаксису чи актуальній схемі бази.
  causes:
  - У запиті неправильна назва колонки
  - Міграції не застосовано
  fixes:
  - Перевір згенерований SQL
  - Звір структуру таблиць із моделями
sqlalchemy_no_result_found:
  title: SQLAlchemy не знайшов запису
  explanation: Запит, який вимагав один результат, повернув нуль рядків.
  causes:
  - Фільтр не відповідає даним
  - Очікуваний запис відсутній
  fixes:
  - Перевір умови запиту
  - Оброби ситуацію відсутнього результату
sqlalchemy_multiple_results_found:
  title: SQLAlchemy повернув забагато результатів
  explanation: Запит, який вимагав один результат, повернув кілька рядків.
  causes:
  - Умови пошуку недостатньо точні
  - Дані містять дублікати
  fixes:
  - Уточни фільтри
  - Обери метод для багатьох результатів, якщо це допустимо
requests_connection_error:
  title: requests не зміг підключитися
  explanation: HTTP-клієнт requests не встановив мережеве з’єднання.
  causes:
  - Сервер недоступний
  - Адреса, порт або проксі неправильні
  fixes:
  - Перевір адресу й доступність сервера
  - Перевір мережу, DNS та проксі
requests_timeout:
  title: Час очікування requests завершився
  explanation: HTTP-запит перевищив установлену межу часу.
  causes:
  - Сервер відповідає повільно
  - Проблема з мережею або читанням відповіді
  fixes:
  - З’ясуй, який етап запиту затримався
  - Встанови доцільний тайм-аут
requests_http_error:
  title: HTTP-запит повернув помилку
  explanation: Сервер повернув HTTP-статус помилки, який клієнт перетворив на виняток.
  causes:
  - Запит не має дозволу
  - Ресурс відсутній або сервер має помилку
  fixes:
  - Перевір HTTP-статус і тіло відповіді
  - Звір параметри та авторизацію
urllib_url_error:
  title: urllib не виконав запит
  explanation: urllib не зміг отримати ресурс за URL через мережеву помилку.
  causes:
  - Невірна адреса
  - DNS або з’єднання не працюють
  fixes:
  - Перевір URL і доступ до мережі
  - Звір налаштування проксі й TLS
urllib_http_error:
  title: urllib отримав помилку HTTP
  explanation: Сервер повернув статус помилки для запиту urllib.
  causes:
  - Ресурс відсутній
  - Доступ заборонений або сервер не працює
  fixes:
  - Перевір статус і тіло відповіді
  - Перевір шлях та права доступу
numpy_axis_error:
  title: Вісь NumPy поза межами масиву
  explanation: Операція NumPy посилається на вісь, якої немає в масиві.
  causes:
  - Запитано завеликий індекс осі
  - Форма масиву відрізняється від очікуваної
  fixes:
  - Перевір ndim і shape
  - Зістав номер осі з кількістю вимірів
pandas_key_error:
  title: Мітку Pandas не знайдено
  explanation: У DataFrame або Series відсутній запитаний стовпець чи індекс.
  causes:
  - Назву стовпця написано неправильно
  - Дані мають інші мітки
  fixes:
  - Перевір columns або index
  - Зістав назву й регістр символів
pandas_parser_error:
  title: Pandas не зміг прочитати дані
  explanation: Парсер Pandas не може узгодити структуру вхідних даних із форматом.
  causes:
  - Некоректний роздільник
  - Рядки мають різну кількість полів
  fixes:
  - Перевір проблемний рядок
  - Вкажи правильний sep або кодування
pytest_failed_assertion:
  title: Перевірка pytest завершилася невдало
  explanation: Тестова умова виявилася хибною або тест викликав fail().
  causes:
  - Фактичний результат не збігається з очікуваним
  - Неправильна підготовка тесту
  fixes:
  - Порівняй значення з виводу pytest
  - Перевір фікстури та вхідні дані
pytest_skipped:
  title: Тест pytest пропущено
  explanation: pytest не виконав тест через умову пропуску.
  causes:
  - Є декоратор skip
  - Умова skipif спрацювала
  fixes:
  - Перевір причину пропуску
  - Звір умови середовища
click_exception:
  title: Команда Click завершилася з помилкою
  explanation: Click повідомив про помилку виконання команди CLI.
  causes:
  - Некоректний параметр
  - Обробник команди явно підняв виняток
  fixes:
  - Перевір введені аргументи
  - Прочитай повний текст повідомлення Click
typer_bad_parameter:
  title: Некоректне значення параметра Typer
  explanation: Typer або Click відхилив параметр командного рядка.
  causes:
  - Неправильний тип значення
  - Параметр не пройшов перевірку
  fixes:
  - Звір аргумент із довідкою
  - Перевір тип і допустимий діапазон
flask_bad_request:
  title: Некоректний HTTP-запит Flask
  explanation: Flask або Werkzeug відхилив вхідний HTTP-запит.
  causes:
  - Відсутнє обов’язкове поле
  - Дані запиту мають неправильний формат
  fixes:
  - Перевір тіло, заголовки та параметри запиту
  - Звір вхідні дані з очікуваннями обробника
jwt_decode_error:
  title: Помилка декодування JWT
  explanation: Бібліотека не змогла розібрати або перевірити формат JWT-токена.
  causes:
  - Токен пошкоджено
  - Неправильний формат або спосіб декодування
  fixes:
  - Перевір структуру трьох частин токена
  - Звір ключ та алгоритм без розголошення секретів
jwt_expired_signature:
  title: Термін дії JWT завершився
  explanation: Позначка часу exp у токені вказує, що термін дії минув.
  causes:
  - Токен застарів
  - Годинник системи має зміщення
  fixes:
  - Перевір exp і поточний час
  - Отримай новий токен у звичайному процесі авторизації
yaml_error:
  title: Помилка синтаксису YAML
  explanation: Парсер YAML не зміг прочитати документ.
  causes:
  - Порушено відступи
  - Некоректно записано ключ або значення
  fixes:
  - Перевір повідомлені рядок і колонку
  - Зістав відступи та роздільники
toml_decode_error:
  title: Помилка синтаксису TOML
  explanation: Парсер TOML не зміг розібрати файл налаштувань.
  causes:
  - Некоректні лапки або таблиця
  - Ключ оголошено з помилкою
  fixes:
  - Перевір рядок збоїв
  - Звір ключі, таблиці й типи значень
importlib_metadata_package_not_found:
  title: Метадані пакета не знайдено
  explanation: В інтерпретаторі немає метаданих установленого пакета.
  causes:
  - Пакет не встановлено у вибраному середовищі
  - Назва дистрибутива відрізняється від назви імпорту
  fixes:
  - Перевір обраний Python і встановлені пакети
  - Звір назву дистрибутива
django_improperly_configured:
  title: Некоректні налаштування Django
  explanation: Django повідомив про неправильну або неповну конфігурацію.
  causes:
  - Відсутній потрібний параметр settings
  - Неправильно вказано застосунок або шлях
  fixes:
  - Перевір settings.py і змінні середовища
  - Звір INSTALLED_APPS та конфігурацію
django_no_reverse_match:
  title: Django не зміг побудувати URL
  explanation: Механізм reverse не знайшов URL-маршрут, що відповідає імені й аргументам.
  causes:
  - Ім’я маршруту неправильне
  - Набір параметрів не відповідає шаблону URL
  fixes:
  - Перевір ім’я та namespace маршруту
  - Зістав параметри з urlpatterns
fastapi_response_validation_error:
  title: Відповідь FastAPI не проходить перевірку
  explanation: Дані, повернуті endpoint, не відповідають оголошеній response_model.
  causes:
  - Немає обов’язкового поля
  - Тип даних відрізняється від схеми
  fixes:
  - Перевір фактичне значення return
  - Зістав його з моделлю відповіді Pydantic
sqlalchemy_operational_error:
  title: Помилка роботи з базою SQLAlchemy
  explanation: Драйвер бази повідомив про проблему підключення або виконання операції.
  causes:
  - База даних недоступна
  - Параметри підключення або SQL-операції некоректні
  fixes:
  - Перевір URL підключення та стан сервера
  - Прочитай вихідну помилку драйвера
django_command_error:
  title: Команда керування Django завершилася з помилкою
  explanation: Керувальна команда Django відхилила запуск або не змогла завершити операцію.
  causes:
  - Неправильні аргументи команди
  - Налаштування проєкту заважають виконанню
  fixes:
  - Перевір текст CommandError
  - Звір аргументи й налаштування Django
alembic_command_error:
  title: Команда міграцій Alembic завершилася з помилкою
  explanation: Alembic не виконав команду керування міграціями.
  causes:
  - Ревізію не знайдено
  - Історія або конфігурація міграцій неузгоджена
  fixes:
  - Перевір ID ревізії та її батьків
  - Звір alembic.ini й env.py
pytest_fixture_lookup_error:
  title: Фікстуру pytest не знайдено
  explanation: pytest не знайшов фікстуру з потрібним ім’ям.
  causes:
  - У назві є помилка
  - Фікстуру не імпортовано або вона поза областю пошуку
  fixes:
  - Перевір назву фікстури
  - Звір conftest.py та область доступності
aiogram_telegram_bad_request:
  title: Telegram відхилив запит aiogram
  explanation: Telegram API повернув помилку Bad Request для запиту бота.
  causes:
  - Некоректний параметр методу
  - Невірний ідентифікатор чату чи повідомлення
  fixes:
  - Прочитай опис помилки Telegram
  - Перевір параметри виклику API
pytelegrambotapi_api_exception:
  title: Помилка Telegram API у pyTelegramBotAPI
  explanation: Telegram API відхилив запит, виконаний бібліотекою pyTelegramBotAPI.
  causes:
  - Недопустимий параметр запиту
  - Недійсне повідомлення або ресурс
  fixes:
  - Звір код і текст відповіді API
  - Перевір метод та його параметри
